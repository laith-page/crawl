# Written by tools, do not edit: `l3 fix` rewrites this file
name: deploy
on:
  workflow_dispatch:
    inputs:
      sha:
        description: The commit ci passed, deployed while it is main's head
        type: string
        required: true
      run_id:
        description: "ci's run of it: its build jobs' files"
        type: string
        required: true
concurrency:
  group: deploy-main
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    environment: production
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: bash
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    outputs:
      current: ${{ steps.head.outputs.current }}
    steps:
      - name: Still main's head
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" -q .sha)
          if [ "$head" = "$SHA" ]; then echo current=true >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "::notice::main moved past $SHA to $head: that commit's own run deploys it"
          echo current=false >> "$GITHUB_OUTPUT"
      - if: ${{ steps.head.outputs.current == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: mise through the mirror
        if: ${{ steps.head.outputs.current == 'true' }}
        id: mirror
        env:
          MISE_VERSION: 2026.10.0
          MIRROR: https://cache.l3.ai/mirror
          MISE_SHA256_LINUX_X64: 57ced973f968b8fbab07aa8e32bd7077d4a357e200a22356d98963c723c6de0a
          MISE_SHA256_LINUX_ARM64: 4b8cacffac83e8493fc5d1eef25f6365edba73ccbed5a1f3987b7cb3f5079656
          MISE_SHA256_MACOS_ARM64: 8d2007efdae0c2b64e3955257533e6ec17197bc2fdcbc5dd8f6847f92881deea
        run: |
          set -uo pipefail
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) target=linux-x64 want=$MISE_SHA256_LINUX_X64;;
            Linux-ARM64) target=linux-arm64 want=$MISE_SHA256_LINUX_ARM64;;
            macOS-ARM64) target=macos-arm64 want=$MISE_SHA256_MACOS_ARM64;;
            *) exit 0;;
          esac
          [ -f /etc/alpine-release ] && exit 0
          dir="${MISE_DATA_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/mise}/bin"
          mkdir -p "$dir"
          asset="v$MISE_VERSION/mise-v$MISE_VERSION-$target"
          for url in "$MIRROR/github.com/jdx/mise/releases/download/$asset" "https://github.com/jdx/mise/releases/download/$asset"; do
            if curl -fsSL --retry 2 --retry-all-errors --connect-timeout 10 -o "$dir/mise.download" "$url" &&
              [ "$( (sha256sum "$dir/mise.download" 2>/dev/null || shasum -a 256 "$dir/mise.download") | cut -d' ' -f1)" = "$want" ]; then
              chmod +x "$dir/mise.download" && mv "$dir/mise.download" "$dir/mise"
              echo "sha256=$want" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::notice::mise $MISE_VERSION not fetched from $url; the next source"
          done
          rm -f "$dir/mise.download"
      - if: ${{ steps.head.outputs.current == 'true' }}
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        env:
          MISE_URL_REPLACEMENTS: "{\"regex:^https://github\\\\.com(/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/releases/download/[^/]*[0-9][^/]*/[^/]+)$\":\"https://cache.l3.ai/mirror/github.com$1\",\"regex:^https://dl\\\\.google\\\\.com(/go/go[0-9][^/]*)$\":\"https://cache.l3.ai/mirror/dl.google.com$1\",\"regex:^https://ziglang\\\\.org(/download/[0-9]+\\\\.[0-9]+\\\\.[0-9]+/[^/]+)$\":\"https://cache.l3.ai/mirror/ziglang.org$1\",\"regex:^https://download\\\\.java\\\\.net(/java/GA/jdk[0-9][^/]*/[^?]+)$\":\"https://cache.l3.ai/mirror/download.java.net$1\"}"
        with:
          version: 2026.10.0
          sha256: ${{ steps.mirror.outputs.sha256 }}
          cache: true
      - name: Cache bun
        if: ${{ steps.head.outputs.current == 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache maven
        if: ${{ steps.head.outputs.current == 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-${{ runner.arch }}-
      - name: Dependencies
        if: ${{ steps.head.outputs.current == 'true' }}
        run: bun install --frozen-lockfile --ignore-scripts
      - name: flyctl
        if: ${{ steps.head.outputs.current == 'true' }}
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
        with:
          version: 0.4.111
      - name: The build jobs' files
        if: ${{ steps.head.outputs.current == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        env:
          NODE_OPTIONS: "--disable-warning=DEP0005"
        with:
          pattern: prebuilt-*
          path: .tools/prebuilt/
          merge-multiple: true
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Deploy
        if: ${{ steps.head.outputs.current == 'true' }}
        env:
          BUILD_COMMIT: ${{ inputs.sha }}
          GH_TOKEN: ${{ github.token }}
          GATE_RUN_ID: ${{ inputs.run_id }}
          L3_PREBUILT: .tools/prebuilt
        run: bunx l3 deploy
      - name: Upload results and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deploy
          path: |
            .tools/results/
            .tools/logs/
          if-no-files-found: ignore
          retention-days: 7
  smoke:
    name: smoke ${{ matrix.runner }}
    needs:
      - deploy
    if: ${{ needs.deploy.outputs.current == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04-arm
            tools: bun java jbang
          - runner: ubuntu-26.04
            tools: bun java jbang
          - runner: macos-latest
            tools: bun java jbang
          - runner: windows-latest
            tools: bun
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 1
          persist-credentials: false
      - id: mirror
        name: mise through the mirror
        env:
          MISE_VERSION: 2026.10.0
          MIRROR: https://cache.l3.ai/mirror
          MISE_SHA256_LINUX_X64: 57ced973f968b8fbab07aa8e32bd7077d4a357e200a22356d98963c723c6de0a
          MISE_SHA256_LINUX_ARM64: 4b8cacffac83e8493fc5d1eef25f6365edba73ccbed5a1f3987b7cb3f5079656
          MISE_SHA256_MACOS_ARM64: 8d2007efdae0c2b64e3955257533e6ec17197bc2fdcbc5dd8f6847f92881deea
        run: |
          set -uo pipefail
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) target=linux-x64 want=$MISE_SHA256_LINUX_X64;;
            Linux-ARM64) target=linux-arm64 want=$MISE_SHA256_LINUX_ARM64;;
            macOS-ARM64) target=macos-arm64 want=$MISE_SHA256_MACOS_ARM64;;
            *) exit 0;;
          esac
          [ -f /etc/alpine-release ] && exit 0
          dir="${MISE_DATA_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/mise}/bin"
          mkdir -p "$dir"
          asset="v$MISE_VERSION/mise-v$MISE_VERSION-$target"
          for url in "$MIRROR/github.com/jdx/mise/releases/download/$asset" "https://github.com/jdx/mise/releases/download/$asset"; do
            if curl -fsSL --retry 2 --retry-all-errors --connect-timeout 10 -o "$dir/mise.download" "$url" &&
              [ "$( (sha256sum "$dir/mise.download" 2>/dev/null || shasum -a 256 "$dir/mise.download") | cut -d' ' -f1)" = "$want" ]; then
              chmod +x "$dir/mise.download" && mv "$dir/mise.download" "$dir/mise"
              echo "sha256=$want" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::notice::mise $MISE_VERSION not fetched from $url; the next source"
          done
          rm -f "$dir/mise.download"
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        env:
          MISE_URL_REPLACEMENTS: "{\"regex:^https://github\\\\.com(/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/releases/download/[^/]*[0-9][^/]*/[^/]+)$\":\"https://cache.l3.ai/mirror/github.com$1\",\"regex:^https://dl\\\\.google\\\\.com(/go/go[0-9][^/]*)$\":\"https://cache.l3.ai/mirror/dl.google.com$1\",\"regex:^https://ziglang\\\\.org(/download/[0-9]+\\\\.[0-9]+\\\\.[0-9]+/[^/]+)$\":\"https://cache.l3.ai/mirror/ziglang.org$1\",\"regex:^https://download\\\\.java\\\\.net(/java/GA/jdk[0-9][^/]*/[^?]+)$\":\"https://cache.l3.ai/mirror/download.java.net$1\"}"
        with:
          version: 2026.10.0
          sha256: ${{ steps.mirror.outputs.sha256 }}
          cache: true
          install_args: ${{ matrix.tools }}
          cache_key_prefix: mise-smoke
      - name: Cache bun
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      - name: Dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Live files against what was published
        run: bunx l3 test e2e --live --published
      - name: Upload results and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-${{ matrix.runner }}
          path: |
            .tools/results/
            .tools/logs/
          if-no-files-found: ignore
          retention-days: 7
