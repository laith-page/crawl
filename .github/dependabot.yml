# Written by tools (mise run dependabot): every ecosystem this repository uses, weekly, grouped so a week's
# updates are one pull request per ecosystem, and security fixes one more.
version: 2
updates:
  - package-ecosystem: bun
    directories:
      - "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    ignore:
      - dependency-name: "@tools/*"
    groups:
      bun:
        applies-to: version-updates
        patterns: ["*"]
      bun-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: cargo
    directories:
      - "/ports/rust"
    schedule:
      interval: weekly
      day: monday
    cooldown:
