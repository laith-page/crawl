name: builders
description: "What a release's part needs beyond the toolchains: Node 22 for wrangler, flyctl for a Fly deploy, an image's builders and the registry login. Only the release's part jobs (deploy.yml, release.yml) call it, so no gate job downloads these actions"
inputs:
  part:
    description: "The release part (`deploy`, `image-manifest`, `tag`, `publish-<host>`)"
    default: ""
  docker:
    description: "`true`: qemu for a whole image, buildx, the registry login and the cache's runtime token"
    default: "false"
  flyctl:
    description: "`true`: flyctl, for a Fly deploy"
    default: "false"
  node:
    description: "`true`: Node 22, which wrangler wants"
    default: "false"
runs:
  using: composite
  steps:
    # wrangler (the bucket's writer, a Worker's deploy) wants Node 22; a runner's own may be older.
    - if: inputs.node == 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
    # A whole multi-platform image emulates its other platform; an image-<arch> part builds on its own architecture's
    # runner, and the manifest builds nothing.
    - if: inputs.docker == 'true' && !startsWith(inputs.part, 'image-')
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      with:
        platforms: linux/arm64
    - if: inputs.docker == 'true' && inputs.part != 'image-manifest'
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - if: inputs.docker == 'true' && env.DOCKERHUB_TOKEN != ''
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: ${{ env.DOCKERHUB_USERNAME }}
        password: ${{ env.DOCKERHUB_TOKEN }}
    # The cache's token, for buildx's gha cache: a `run` step does not get it on its own.
    - if: inputs.docker == 'true' && inputs.part != 'image-manifest'
      uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
    - if: inputs.flyctl == 'true' && env.FLY_API_TOKEN != ''
      uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
