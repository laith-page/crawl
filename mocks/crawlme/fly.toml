# crawlme: https://crawlme.fly.dev serves what the origin served on capture day.
#
#   fly launch --no-deploy --name crawlme
#   l3 deploy (CI deploys it on a green main)
#
# crawlme.json is a plain replay. To add latency or faults, give it rules, or switch them on
# while running with PUT /__faulty/scenarios/{name} (FAULTY_TOKEN, a Fly secret).
app = "crawlme"
primary_region = "lhr"

[env]
# The heap Go aims under: without it the collector lets garbage run to twice the live set, and
# the replay's peak came within reach of the machine. e2e/mocks.test.ts replays under the same value.
GOMEMLIMIT = "350MiB"

[build]
dockerfile = "Dockerfile"

# The guest keeps some of the 512 MB for itself, so the replay must fit in less.
# e2e/mocks.test.ts replays the real archive at this GOMEMLIMIT and fails a peak over 400 MiB first.
[[vm]]
size = "shared-cpu-1x"
memory = "512mb"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0
processes = ["app"]

[http_service.concurrency]
type = "requests"
hard_limit = 500
soft_limit = 400

[[http_service.checks]]
method = "GET"
path = "/health"
interval = "30s"
timeout = "5s"
grace_period = "10s"
